<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TrainAI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #f7f7fa;
    color: #242428;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e6e6eb;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
    margin: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
  h1 span { color: #fc5200; }
  p.sub { color: #6d6d78; font-size: 0.85rem; margin-bottom: 20px; }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #d1d1da;
    background: #fff;
    color: #242428;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  input[type="password"]:focus { outline: none; border-color: #fc5200; }
  label.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #6d6d78;
    margin-bottom: 16px;
    cursor: pointer;
  }
  label.remember input { accent-color: #fc5200; }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #fc5200;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #e04a00; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .error { color: #b3261e; font-size: 0.85rem; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>TRAIN<span>·</span>AI</h1>
  <p class="sub">Diese Seite ist verschlüsselt. Bitte Passwort eingeben.</p>
  <form id="form">
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
    <label class="remember"><input type="checkbox" id="remember" checked> Auf diesem Gerät merken</label>
    <button type="submit" id="btn">Entsperren</button>
    <div class="error" id="err">Falsches Passwort.</div>
  </form>
</div>

const ITER = 310000;
const STORE_KEY = "trainai_unlock_v1";

const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
const salt = raw.slice(0, 16), iv = raw.slice(16, 32), mac = raw.slice(32, 64), ct = raw.slice(64);

async function deriveBits(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, km, 512));
}

async function tryDecrypt(bits) {
  const macData = new Uint8Array(salt.length + iv.length + ct.length);
  macData.set(salt, 0); macData.set(iv, salt.length); macData.set(ct, salt.length + iv.length);
  const macKey = await crypto.subtle.importKey("raw", bits.slice(32, 64), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const ok = await crypto.subtle.verify("HMAC", macKey, mac, macData);
  if (!ok) return null;
  const aesKey = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, aesKey, ct);
  return new TextDecoder().decode(plain);
}

function toHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join(""); }
function fromHex(hex) { return new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16))); }

function render(html) {
  document.open();
  document.write(html);
  document.close();
}

async function unlock(bits, remember) {
  const html = await tryDecrypt(bits);
  if (html === null) return false;
  if (remember) { try { localStorage.setItem(STORE_KEY, toHex(bits)); } catch (e) {} }
  render(html);
  return true;
}

// Gespeicherten Schlüssel automatisch probieren.
// Erst nach Abschluss des Parsens, sonst ignoriert der Browser document.open/write.
async function autoUnlock() {
  try {
    const stored = localStorage.getItem(STORE_KEY);
    if (!stored) return;
    if (!(await unlock(fromHex(stored), false))) localStorage.removeItem(STORE_KEY);
  } catch (e) {}
}
if (document.readyState === "loading") {
  window.addEventListener("DOMContentLoaded", () => { setTimeout(autoUnlock, 0); });
} else {
  autoUnlock();
}

document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Prüfe...";
  try {
    const bits = await deriveBits(document.getElementById("pw").value);
    const ok = await unlock(bits, document.getElementById("remember").checked);
    if (!ok) {
      err.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Entsperren";
    }
  } catch (e) {
    err.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Entsperren";
  }
});
